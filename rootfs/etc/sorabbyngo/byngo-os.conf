# Sorabbyngo Byngo OS — Consumer Runtime Configuration
OS_VARIANT=byngo
OS_VERSION=1.0.0
DEPLOYMENT=consumer

# Voice-first — Chameha is the primary interface
CHAMEHA_ENABLED=true
CHAMEHA_MODE=consumer
CHAMEHA_VOICE_FIRST=true
WHISPER_MODEL=/opt/sorabbyngo/models/whisper/ggml-base.bin
COQUI_MODEL=tts_models/en/ljspeech/vits

# Languages — Africa-native
PRIMARY_LANGUAGE=en
SUPPORTED_LANGUAGES=en,sw,ha,yo,am,ig,fr,ar
LANGUAGE_MODEL=aya23:8b

# AI tier — consumer devices
AI_TIER=1
TIER1_MODEL=phi4-mini
DEVICE_CONTROL_MODEL=smollm2:360m

# Android compatibility layer
ART_ENABLED=true
ANDROID_COMPAT_MODE=true

# No passwords — biometric only
BIOMETRIC_AUTH=true
PASSWORD_AUTH=false

# Intent computing — no app launcher
INTENT_COMPUTING=true
APP_LAUNCHER=false

# Byngonet mesh
BYNGONET_ENABLED=true
BYNGONET_TIER=T2_ARM64

# Privacy — consumer data stays on device
OFFLINE_FIRST=true
TELEMETRY_ENABLED=false
CLOUD_AI_ENABLED=false
DATA_SOVEREIGNTY=strict

# Security
CML_ENABLED=true
SENTINEL_ENABLED=true
CYBERWALL_ENABLED=true
